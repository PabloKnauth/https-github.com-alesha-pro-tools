<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--ARTIFACT-START-->
<title>Forja GBA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Silkscreen&display=swap">
<link rel="stylesheet" href="app.css">
<!--HEAD-END-->
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#inicio" aria-label="Forja GBA, inicio">
      <span class="brand-mark" aria-hidden="true"></span><span class="brand-name">FORJA<span>GBA</span></span>
    </a>
    <label class="proj"><span class="sr">Nombre del proyecto</span><input id="proj-name" maxlength="40" autocomplete="off"></label>
    <div class="top-actions">
      <button class="btn ghost" id="btn-open" type="button">Abrir</button>
      <button class="btn ghost" id="btn-save" type="button" title="Ctrl+S">Guardar</button>
      <button class="btn primary" id="btn-export" type="button">Exportar</button>
      <input type="file" id="open-file" accept=".json" hidden>
    </div>
  </div>
  <nav id="nav" class="nav" aria-label="Secciones"></nav>
</header>
<main id="view" tabindex="-1"></main>
<div id="toasts" aria-live="polite"></div>
<div class="drop-hint" aria-hidden="true">Suelta tus imágenes o proyecto aquí</div>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/importer.js"></script>
<script src="js/pixel.js"></script>
<script src="js/fakemon.js"></script>
<script src="js/map.js"></script>
<script src="js/events.js"></script>
<script src="js/play.js"></script>
<script src="js/export.js"></script>
<script src="js/sample.js"></script>
<script src="js/app.js"></script>
<!--ARTIFACT-END-->
</body>
</html>
